# fails when site.env was edited but tools/build.py wasn't run afterwards
name: check site.env build

on:
  push:
  pull_request:

# read only. this job never writes to the repo
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: generated files match site.env
        run: python3 tools/build.py --check
