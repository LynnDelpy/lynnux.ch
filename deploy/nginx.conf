# GENERATED by tools/build.py from site.env (DOMAINS, WEBROOT) and _headers.
# do not edit this file: edit those, then run python3 tools/build.py
#
# 1. COPY it (do not symlink: certbot edits it) to /etc/nginx/sites-available/lynnux.conf
#    and link that into sites-enabled. no sites-* dirs? /etc/nginx/conf.d/lynnux.conf
# 2. nginx -t && systemctl reload nginx
# 3. https: certbot --nginx -d lynnux.ch -d www.lynnux.ch -d lynnux.li -d www.lynnux.li
#    certbot adds the certificate lines and the http -> https redirect itself.
# server has IPv6 switched off (nginx -t: "Address family not supported")? delete the [::] lines.

map $uri $lynnux_cache_control {
    "~^/assets/fonts/" "public, max-age=31536000, immutable";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name www.lynnux.ch;
    return 301 $scheme://lynnux.ch$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.lynnux.li;
    return 301 $scheme://lynnux.li$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lynnux.ch lynnux.li;
    root /srv/lynnux/dist;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $lynnux_cache_control always;

    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }
}
